<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laura Boyd × Heaps Normal</title>
<meta name="description" content="A very sincere application to join the team at Heaps Normal.">
<style>
  :root { --ink:#000; --paper:#fff; --mute:#8a8a8a; --wash:#f3f3f3; --gutter:clamp(20px,5vw,72px); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:var(--paper); }
  body {
    color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-weight:700; letter-spacing:-.035em; line-height:.98;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  a { color:inherit; }
  @media (hover:hover) and (pointer:fine) { body, a, button { cursor:none; } }

  /* chrome */
  .progress { position:fixed; top:0; left:0; height:3px; width:100%; background:var(--ink); transform-origin:0 50%; transform:scaleX(0); z-index:50; }
  .tag { position:fixed; top:20px; left:var(--gutter); font-size:13px; font-weight:500; letter-spacing:0; z-index:40; }
  .tag.r { left:auto; right:var(--gutter); }

  .sign {
    position:fixed; top:64px; left:50%; z-index:45; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); border-radius:999px;
    padding:.7em 1.3em .75em; font-size:clamp(14px,1.5vw,18px); font-weight:500; letter-spacing:-.01em;
    display:flex; gap:.7em; align-items:center; white-space:nowrap;
    transition:opacity .5s, transform .5s;
  }
  .sign b { display:inline-block; animation:bob 1.2s ease-in-out infinite; font-weight:500; }
  .sign.gone { opacity:0; transform:translate(-50%,-20px); pointer-events:none; }
  @keyframes bob { 0%,100% { transform:translateY(-2px); } 50% { transform:translateY(4px); } }

  /* scroll track + stage */
  #track { width:1px; }
  /* the "drum": every beat sits on a rotating column; only ±2 neighbours are visible, fading out */
  #stage { position:fixed; inset:0; overflow:hidden; perspective:1600px; perspective-origin:50% 50%; }
  .step {
    position:absolute; left:0; right:0; top:50%; padding:0 var(--gutter);
    opacity:0; visibility:hidden; pointer-events:none; will-change:transform,opacity;
    transform-origin:50% 50%; backface-visibility:hidden;
  }
  .step.on { pointer-events:auto; }
  .inner { width:100%; max-width:1400px; margin:0 auto; display:grid; gap:clamp(20px,4vw,64px); align-items:center; }
  .inner.has-img { grid-template-columns:1.4fr 1fr; }
  .step[data-side] .txt { max-width:68%; transition:transform .9s cubic-bezier(.2,.7,.2,1); }
  .step[data-side="r"] .txt { margin-left:auto; text-align:right; transform:translateX(5vw); }
  .step[data-side="l"] .txt { transform:translateX(-5vw); }
  .step[data-side].on .txt { transform:none; }
  .step[data-side="r"] .txt p { margin-left:auto; }
  @media (max-width:760px) { .step[data-side] .txt { max-width:100%; } }
  .txt > * + * { margin-top:clamp(14px,2vw,28px); }

  .huge { font-size:clamp(44px,9vw,160px); line-height:.92; }
  .big  { font-size:clamp(32px,5.6vw,100px); }
  .mid  { font-size:clamp(24px,3.6vw,62px); }
  .small{ font-size:clamp(17px,1.9vw,28px); font-weight:500; letter-spacing:-.02em; line-height:1.2; max-width:40ch; }
  .mute { color:var(--mute); }
  .sky { position:relative; width:100%; height:clamp(120px,30vh,300px); }
  .plane { position:absolute; left:0; top:0; height:100%; width:auto; aspect-ratio:1000/220; will-change:transform; overflow:visible; }
  .plane path, .plane circle, .plane ellipse, .plane line { stroke:#000; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; fill:#fff; }
  .plane .nf { fill:none; }
  .plane text { font-family:"Caveat","Bradley Hand","Segoe Script",cursive; font-weight:600; fill:#000; stroke:none; font-size:64px; }
  .plane .bob { animation:bob 2.4s ease-in-out infinite; }
  .plane .flap { animation:flap 1.1s ease-in-out infinite; transform-origin:640px 118px; transform-box:view-box; }
  .plane .prop { animation:prop .12s linear infinite; transform-origin:962px 125px; transform-box:view-box; }
  @keyframes bob { 50% { transform:translateY(8px); } }
  @keyframes flap { 50% { transform:skewY(2.5deg); } }
  @keyframes prop { 50% { transform:scaleY(.25); } }


  /* visual beats */
  .ul { background:linear-gradient(#000,#000) 0 94%/0 .07em no-repeat; transition:background-size .9s .35s cubic-bezier(.6,0,.2,1); }
  .step.on .ul { background-size:100% .07em; }
  .clogo { display:block; height:clamp(40px,4.6vw,64px); width:auto; }
  .art.vis { width:min(100%,360px); }
  .sk, .sk * { stroke:#000; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; fill:#fff; }
  .sk .nf { fill:none; }
  .sk text { font-family:"Caveat","Bradley Hand",cursive; font-weight:600; stroke:none; fill:#000; }
  .sk { width:100%; height:auto; max-height:34vh; overflow:visible; }
  .hd { position:relative; width:min(100%,360px,31vh); margin:0 auto; padding-top:30%; }
  .art .hd img { display:block; width:100%; height:auto; max-height:none; box-shadow:none; border-radius:0; }
  .art .hd .hd-c { position:absolute; top:0; left:10%; width:80%; mix-blend-mode:multiply; transform-origin:50% 60%; }
  .step.on .hd .hd-c { animation:storm 1.6s ease-in-out infinite; }
  @keyframes storm { 0%,100% { transform:translate(0,0) rotate(-2.5deg); } 25% { transform:translate(8px,-6px) rotate(1.5deg); } 50% { transform:translate(-4px,4px) rotate(2.5deg); } 75% { transform:translate(-9px,-4px) rotate(-1deg); } }
  .cloud { transform-origin:50% 50%; }
  .step.on .cloud { animation:wob 1.4s ease-in-out infinite; }
  @keyframes wob { 50% { transform:translate(4px,-5px) rotate(2deg); } }
  .receipt { font-family:"SF Mono",Menlo,Consolas,monospace; font-size:clamp(11px,1.15vw,15px); line-height:1.7; background:#fff; color:#000; padding:1.4em 1.4em 1.8em; text-transform:uppercase;
    box-shadow:0 18px 40px -22px rgba(0,0,0,.45); transform:rotate(2.2deg); clip-path:inset(0 0 100% 0); transition:clip-path 1.8s steps(16); position:relative; width:min(100%,300px); margin:0 auto; }
  .step.on .receipt { clip-path:inset(0); }
  .receipt hr { border:0; border-top:2px dashed #000; margin:.6em 0; }
  .receipt .r { display:flex; justify-content:space-between; gap:1em; }
  .receipt .c { text-align:center; font-weight:700; }
  .stamps { display:flex; flex-wrap:wrap; gap:1.2vw; justify-content:center; max-width:360px; margin:0 auto; }
  .stamp { font-weight:800; letter-spacing:.06em; font-size:clamp(13px,1.5vw,20px); text-transform:uppercase; border:3px solid #000; outline:2px solid #000; outline-offset:3px; padding:.5em .8em; border-radius:6px;
    opacity:0; transform:scale(1.8) rotate(var(--r)); transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1); }
  .stamp.round { border-radius:50%; padding:1.1em 1em; }
  .step.on .stamp { opacity:1; transform:scale(1) rotate(var(--r)); }
  .step.on .stamp:nth-child(1){transition-delay:.15s} .step.on .stamp:nth-child(2){transition-delay:.4s} .step.on .stamp:nth-child(3){transition-delay:.65s} .step.on .stamp:nth-child(4){transition-delay:.9s} .step.on .stamp:nth-child(5){transition-delay:1.15s}

  .lblwrap { text-align:center; }
  .lblwrap .lbl { position:relative; display:inline-block; font-weight:700; letter-spacing:-.02em; font-size:clamp(16px,1.8vw,26px); padding:.5em .9em; border:2.5px solid #000; border-radius:6px; background:#fff; transform:rotate(-2deg); color:#000; }
  .lblwrap .lbl i { position:absolute; left:-4%; top:52%; height:3px; width:0; background:#000; transition:width .6s .5s ease-out; transform:rotate(-2deg); }
  .step.on .lblwrap .lbl i { width:108%; }
  .chips { display:flex; flex-wrap:wrap; gap:.6em; justify-content:center; margin-top:1.4em; }
  .chips b { font-size:clamp(13px,1.3vw,18px); font-weight:700; letter-spacing:-.01em; padding:.45em .85em; border-radius:99px; background:#000; color:#fff; opacity:0; transform:scale(.4) rotate(var(--r,0deg)); transition:opacity .25s,transform .4s cubic-bezier(.3,1.7,.5,1); }
  .chips b:nth-child(odd) { --r:-4deg; } .chips b:nth-child(even) { --r:3deg; background:#fff; color:#000; border:2px solid #000; }
  .step.on .chips b { opacity:1; transform:scale(1) rotate(var(--r)); }
  .step.on .chips b:nth-child(1){transition-delay:1.1s} .step.on .chips b:nth-child(2){transition-delay:1.3s} .step.on .chips b:nth-child(3){transition-delay:1.5s} .step.on .chips b:nth-child(4){transition-delay:1.7s} .step.on .chips b:nth-child(5){transition-delay:1.9s} .step.on .chips b:nth-child(6){transition-delay:2.1s}
  .stat { background:#000; color:#fff; border-radius:8px; padding:clamp(18px,2.4vw,36px); transform:rotate(-2deg); box-shadow:0 18px 40px -22px rgba(0,0,0,.45); }
  .stat b { display:block; font-size:clamp(34px,4.4vw,72px); line-height:.95; letter-spacing:-.04em; }
  .stat b + b { margin-top:.35em; color:#bbb; }
  .stat small { display:block; margin-top:1em; font-size:clamp(12px,1.1vw,15px); color:#999; letter-spacing:0; }
  .tk { display:inline-block; width:1.1em; height:1.1em; vertical-align:-.2em; margin-right:.35em; }
  .tk path { fill:none; stroke:#000; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
  .num  { font-size:14px; font-weight:500; letter-spacing:0; color:var(--mute); }

  /* image slots — swap each for the real thing */
  .imgs { display:grid; gap:clamp(10px,1.6vw,22px); }
  .imgs.n3 { grid-template-columns:repeat(3,1fr); }
  .ph { position:relative; background:var(--wash); border-radius:4px; display:flex; align-items:flex-end; padding:12px 14px;
        font-size:12px; font-weight:500; letter-spacing:0; color:var(--mute); overflow:hidden; aspect-ratio:4/5; max-height:62vh; }
  .ph::before { content:""; position:absolute; inset:9px; border:1px dashed #c9c9c9; border-radius:2px; }
  .ph span { position:relative; }
  .ph img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .ph svg { position:absolute; inset:0; margin:auto; width:55%; height:65%; stroke:#bdbdbd; fill:none; stroke-width:1.5; stroke-linecap:round; }
  .art { margin:0 auto; width:fit-content; max-width:100%; }
  .art video { aspect-ratio:9/16; object-fit:cover; background:#eee; }
  .art img, .art video { display:block; max-width:100%; max-height:58vh; width:auto; height:auto; border-radius:3px; box-shadow:0 18px 40px -22px rgba(0,0,0,.45); }
  .stackimg .art { margin:0; }
  .stackimg .art img { max-height:44vh; }
  .art.embed { width:min(100%,340px); }
  .art.tt { width:min(100%,330px); } .art.tt blockquote { margin:0 auto; max-width:325px; min-width:0 !important; }
  .art.tt blockquote, .art.tt iframe { height:min(60vh,700px) !important; max-height:60vh; }
  .ttl { display:block; margin-top:.8em; font-size:14px; font-weight:500; text-align:center; color:var(--mute); text-decoration:underline; }
  .art.embed iframe { display:block; width:100%; height:min(62vh,580px); border:1px solid #e3e3e3; border-radius:6px; background:#fff; }
  .art.plain img { box-shadow:none; border-radius:0; max-height:min(52vh,260px); }
  .art figcaption { margin-top:8px; font-size:10px; font-weight:500; letter-spacing:.01em; color:var(--mute); }
  .tilt-a { transform:rotate(-2.5deg); } .tilt-b { transform:rotate(2deg); }
  .imgs.n3 .ph:nth-child(2) { margin-top:6vh; }

  /* speech bubbles: the "a beer is…" moment pops out of the vertical flow */
  .bubbles > p { margin-bottom:2vh; }
  .bubarea { position:relative; width:100%; height:min(64vh,640px); }
  .bub { position:absolute; left:var(--x); top:var(--y); max-width:min(46%,520px); padding:.5em .85em .58em;
         border:3px solid #000; border-radius:26px; background:#fff; color:#000;
         font-size:clamp(18px,2.7vw,40px); line-height:1.08; letter-spacing:-.025em;
         opacity:0; transform:scale(.15) rotate(var(--r)); transform-origin:30% 100%;
         transition:transform .6s cubic-bezier(.34,1.75,.5,1), opacity .18s ease; }
  .bub.in { opacity:1; transform:scale(1) rotate(var(--r)); }
  .bub.dark { background:#000; color:#fff; }
  .bub::after { content:""; position:absolute; bottom:-12px; left:34px; width:20px; height:20px; background:inherit;
                border-right:3px solid #000; border-bottom:3px solid #000; border-radius:0 0 6px 0; transform:rotate(45deg); }
  .bub:nth-child(even)::after { left:auto; right:34px; }
  @media (max-width:760px) { .bub { left:var(--mx); top:var(--my); max-width:74%; } .bubarea { height:68vh; } }
  @media (prefers-reduced-motion:reduce) { .bub { transition:none; } }

  /* "my job" section: the story turns sideways. Vertical scroll drives a horizontal track of cards */
  .step.hsstep { padding:0; }
  .hs { position:relative; width:100%; overflow:hidden; padding:2vh 0 8vh; }
  .hs-track { display:flex; align-items:center; gap:clamp(16px,3vw,48px); padding:0 12vw 0 var(--gutter); width:max-content; will-change:transform; }
  .hs-card { flex:0 0 auto; width:min(30vw,280px); height:min(52vh,430px); border:3px solid #000; border-radius:28px; background:#fff;
             padding:clamp(14px,1.5vw,22px); border-radius:22px; display:flex; flex-direction:column; justify-content:space-between; transform-origin:50% 70%; will-change:transform; }
  .hs-card.dark { background:#000; color:#fff; }
  .hs-card .n { font-size:clamp(14px,1.4vw,18px); font-weight:500; letter-spacing:0; opacity:.55; }
  .hs-card p { font-size:clamp(18px,1.9vw,29px); line-height:1.06; }
  .hs-card.long p { font-size:clamp(16px,1.55vw,23px); }
  .hs-card.split { width:min(70vw,720px); }
  .hs-card.split { flex-direction:row; gap:clamp(16px,3vw,40px); }
  .hs-card.split .col { flex:1; display:flex; flex-direction:column; justify-content:space-between; }
  .hs-card video { height:100%; aspect-ratio:9/16; object-fit:cover; border-radius:14px; align-self:stretch; background:#eee; }
  .hs-card.intro { width:min(40vw,500px); height:auto; border:0; background:none; padding:0; justify-content:center; }
  .hs-card.intro p { font-size:clamp(30px,4.6vw,76px); line-height:.98; }
  .hs-bar { position:absolute; left:var(--gutter); right:var(--gutter); bottom:2vh; height:3px; background:#e4e4e4; }
  .hs-bar i { display:block; height:100%; background:#000; transform-origin:0 50%; transform:scaleX(0); }
  .hs-count { position:absolute; right:var(--gutter); bottom:calc(2vh + 12px); font-size:14px; font-weight:500; letter-spacing:0; }
  @media (max-width:760px) {
    .hs-card { width:56vw; height:min(50vh,420px); }
    .hs-card p { font-size:clamp(16px,4.4vw,22px); }
    .hs-card.long p { font-size:clamp(14px,3.8vw,18px); }
    .hs-card.intro { width:78vw; }
    .hs-card.split { flex-direction:column; }
    .hs-card video { height:18vh; width:100%; aspect-ratio:auto; }
  }

  /* annotated photos: handwritten notes + hand-drawn arrows laid over the picture */
  .photo-beat { justify-items:center; }
  .photo { position:relative; margin:0 auto; height:min(66vh,680px,calc((100vw - 2 * var(--gutter)) * 1.3333)); aspect-ratio:var(--ar,3/4);
           container-type:size; border-radius:4px; background:#222; transform:rotate(var(--rot,-1.2deg)); box-shadow:0 22px 50px -24px rgba(0,0,0,.55); }
  .photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:4px; }
  .note { position:absolute; font-family:"Caveat","Bradley Hand","Segoe Script","Comic Sans MS",cursive; font-weight:600; color:#fff;
          font-size:var(--fs,6cqw); line-height:1.02; letter-spacing:0; text-shadow:0 1px 6px rgba(0,0,0,.5); transform:rotate(var(--r,-2deg)); white-space:nowrap; }
  .arr { position:absolute; width:11cqw; height:auto; fill:none; stroke:#fff; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 1px 4px rgba(0,0,0,.5)); }
  .arr.down { transform:rotate(180deg); }
  .note.dark { color:#000; text-shadow:0 0 8px rgba(255,255,255,.85); }
  .arr.dark { stroke:#000; filter:drop-shadow(0 0 4px rgba(255,255,255,.85)); }

  /* "beyond social": three overlapping circles, one lit at a time, with the story beside them */
  .inner.vn { grid-template-columns:1.1fr 1fr; align-items:center; }
  .vtxt > p { margin-bottom:2.5vh; }
  .vlist { position:relative; min-height:clamp(160px,26vh,260px); }
  .vi { position:absolute; left:0; top:0; width:100%; opacity:0; transform:translateY(24px); transition:opacity .45s ease, transform .55s cubic-bezier(.2,.7,.2,1); }
  .vi.on { opacity:1; transform:none; }
  .vi .t { font-size:clamp(30px,4.4vw,72px); line-height:1; }
  .vi .d { font-size:clamp(17px,1.9vw,28px); font-weight:500; letter-spacing:-.02em; line-height:1.2; color:var(--mute); margin-top:.7em; max-width:30ch; }
  .vd { position:relative; width:min(44vw,60vh,520px); aspect-ratio:1; margin:0 auto; }
  .vc { position:absolute; width:58%; aspect-ratio:1; border-radius:50%; border:3px solid #000; background:rgba(0,0,0,.05); mix-blend-mode:multiply;
        opacity:0; transform:scale(.5); transition:opacity .3s ease, transform .65s cubic-bezier(.34,1.6,.5,1), background .3s ease; }
  .vc.in { opacity:1; transform:scale(1); }
  .vc.act { background:#000; }
  .vc span { position:absolute; left:var(--lx); top:var(--ly); transform:translate(-50%,-50%); font-size:clamp(12px,1.5vw,20px); font-weight:700; letter-spacing:-.02em; color:#000; transition:color .3s; white-space:nowrap; }
  .vc.act span { color:#fff; }
  .vme { position:absolute; left:50%; top:55%; transform:translate(-50%,-50%) scale(.4); opacity:0; background:#000; color:#fff; border-radius:999px;
         padding:.22em .7em .3em; font-size:clamp(14px,1.8vw,24px); font-weight:700; transition:opacity .3s ease, transform .55s cubic-bezier(.34,1.6,.5,1); }
  .vme.on { opacity:1; transform:translate(-50%,-50%) scale(1); }
  @media (max-width:760px) { .inner.vn { grid-template-columns:1fr; gap:2vh; } .vd { width:min(62vw,34vh); } .vlist { min-height:130px; } .vi .t { font-size:clamp(26px,8vw,40px); } .vi .d { font-size:16px; } }
  @media (prefers-reduced-motion:reduce) { .vi, .vc, .vme { transition:none; } }

  /* closing */
  a.mail { font-size:clamp(22px,3.6vw,56px); text-decoration:none; border-bottom:3px solid var(--ink); display:inline-block; }
  .btn { display:inline-flex; align-items:center; gap:.4em; background:var(--ink); color:var(--paper); text-decoration:none;
         padding:.3em .65em .38em; border-radius:999px; font-size:clamp(26px,4.4vw,64px); transition:transform .3s cubic-bezier(.2,.7,.2,1); }
  .btn:hover { transform:scale(1.03); }
  .btn b { display:inline-block; transition:transform .3s; } .btn:hover b { transform:translateX(.12em) rotate(-12deg); }

  /* can cursor */
  #can { position:fixed; left:0; top:0; width:40px; height:76px; margin:-10px 0 0 -20px; pointer-events:none; z-index:100;
         transform-origin:50% 15%; will-change:transform; opacity:0; transition:opacity .3s; }
  #can.show { opacity:1; }
  #can svg, #can img { width:100%; height:100%; display:block; object-fit:contain; }
  #can svg { stroke:#000; fill:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  @media (hover:none), (pointer:coarse) { #can { display:none; } }

  @media (max-width:760px) {
    .inner.has-img { grid-template-columns:1fr; }
    .ph { max-height:34vh; aspect-ratio:16/10; }
    .imgs.n3 .ph { aspect-ratio:3/4; max-height:30vh; }
    .imgs.n3 .ph:nth-child(2) { margin-top:3vh; }
    .tag { font-size:12px; }
  }
  @media (prefers-reduced-motion:reduce) {
    .sign b { animation:none; }
  }
</style>

<body>
<div class="progress" id="progress"></div>
<div class="tag">Laura Boyd</div>
<div class="tag r">→ Heaps Normal</div>
<div class="sign" id="sign">Start scrolling now <b>↓</b></div>

<div id="stage"></div>
<div id="track"></div>

<!-- cursor: drop your own sketch at assets/can-cursor.png and it replaces this one -->
<div id="can" aria-hidden="true">
  <svg viewBox="0 0 64 64" id="can-svg">
    <path d="M20 12c1-5 23-5 24 0M19.5 12.5c-1 14-1.3 28 .3 39M44.5 12.3c1.2 14 1.2 28-.4 39.3"/>
    <path d="M20 12c1 4.5 23 4.6 24 0" />
    <path d="M19.8 51.5c2 5 22 5.2 24.3.1"/>
    <path d="M19.7 24c8 2.6 16.5 2.4 24.6-.3M19.6 40c8 2.8 16.4 2.6 24.7-.2" stroke-width="1.5"/>
    <path d="M25 31.5l3-1.6 2.8 1.8 3-1.9 3 1.7 3-1.8" stroke-width="1.4"/>

        var vv = steps[k]._vn, idx = -1;
        if (y >= cum[k] - 1) idx = Math.min(3, Math.floor(Math.min(1, (y - cum[k]) / (st.w * unit) / st.hold) * 4));
        vv.circles.forEach(function (c, i) { c.classList.toggle("in", idx >= 0 && (idx >= 3 || i <= idx)); c.classList.toggle("act", idx === i); });
        vv.items.forEach(function (it, i) { it.classList.toggle("on", idx === i); });
        vv.me.classList.toggle("on", idx === 3);
        return;
      }
      if (st.cards) {
        var h = steps[k]._hs, p = y < cum[k] - 1 ? 0 : Math.min(1, (y - cum[k]) / (st.w * unit) / st.hold), x = -p * h.max, best = 0, bd = 1e9;
        h.track.style.transform = "translate3d(" + x.toFixed(1) + "px,0,0)";
        h.bar.style.transform = "scaleX(" + p.toFixed(4) + ")";
        h.cards.forEach(function (c, i) {
          var d = (c.offsetLeft + c.offsetWidth / 2 + x - innerWidth / 2) / innerWidth;
          c.style.transform = reduce ? "" : "rotate(" + (-d * 5).toFixed(2) + "deg) translateY(" + (Math.abs(d) * 16).toFixed(1) + "px)";
          if (Math.abs(d) < bd) { bd = Math.abs(d); best = i; }
        });
        h.count.textContent = p > 0.02 ? pad2(best + 1) + " / " + pad2(h.cards.length) : "";
        return;
      }
      if (st.plane) {
        var pl = steps[k]._pl, pp = y < cum[k] - 1 ? 0 : Math.min(1, (y - cum[k]) / (st.w * unit) / st.hold), pw = pl.getBoundingClientRect().width;
        pl.style.transform = "translate3d(" + (-pw + pp * (innerWidth + pw)).toFixed(1) + "px," + (Math.sin(pp * 6.28) * -8).toFixed(1) + "px,0)";
        return;
      }
      if (!st.bubbles) return;
      var n = st.bubbles.length, c = 0;
      if (y >= cum[k] - 1) c = Math.min(n, Math.floor(Math.min(1, (y - cum[k]) / (st.w * unit) / st.hold) * n) + 1);
      steps[k]._bub.forEach(function (b, i) { b.classList.toggle("in", i < c); });
    });
    var max = document.documentElement.scrollHeight - innerHeight;
    bar.style.transform = "scaleX(" + (max > 0 ? y / max : 0) + ")";
    sign.classList.toggle("gone", y > 30);
  }
  (function tick() {
    pos += (target - pos) * (reduce ? 1 : .14);
    if (Math.abs(target - pos) < .0005) pos = target;
    render(); requestAnimationFrame(tick);
  })();
  layout(); onScroll(); pos = target;
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
  addEventListener("load", function () { layout(); onScroll(); });
  addEventListener("scroll", onScroll, { passive: true });
  addEventListener("resize", function () { layout(); onScroll(); });
  addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); scrollTo({ top: (cum[Math.min(cur + 1, cum.length - 1)] || 0) + 2, behavior: "smooth" }); }
    if (e.key === "ArrowUp" || e.key === "PageUp") { e.preventDefault(); scrollTo({ top: (cum[Math.max(cur - 1, 0)] || 0) + 2, behavior: "smooth" }); }
  });

  /* resume link: put the real URL here */
  document.getElementById("resume").addEventListener("click", function (e) { if (this.getAttribute("href") === "#") e.preventDefault(); });

  /* ---------- can cursor ---------- */
  var can = document.getElementById("can"), img = document.getElementById("can-img"), svg = document.getElementById("can-svg");
  img.onload = function () { img.hidden = false; svg.style.display = "none"; };
  img.onerror = function () { img.remove(); };
  var tx = 0, ty = 0, x = 0, y = 0, rot = 0, sc = 1, tsc = 1;
  addEventListener("pointermove", function (e) { tx = e.clientX; ty = e.clientY; can.classList.add("show"); });
  document.addEventListener("mouseleave", function () { can.classList.remove("show"); });
  addEventListener("pointerdown", function () { tsc = .86; }); addEventListener("pointerup", function () { tsc = 1; });
  document.addEventListener("pointerover", function (e) { tsc = e.target.closest && e.target.closest("a") ? 1.25 : 1; });
  (function loop() {
    var dx = tx - x; x += dx * .22; y += (ty - y) * .22;
    rot += ((Math.max(-28, Math.min(28, dx * 1.2))) - rot) * .15; sc += (tsc - sc) * .2;
    can.style.transform = "translate(" + x + "px," + y + "px) rotate(" + rot + "deg) scale(" + sc + ")";
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
